name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './backend[dev]'
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m app.evaluation.run --dataset evals/questions.jsonl --output evals/results.json
        working-directory: backend
      - run: docker compose --profile app config --quiet
      - run: docker build -f Dockerfile.backend -t procurement-backend-ci .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
